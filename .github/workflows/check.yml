name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check installer scripts
        run: bash -n packaging/preinstall packaging/postinstall packaging/uninstall.command
      - name: Check battery record lifecycle
        run: python3 Tests/run_tests.py
      - name: Build installer for Apple silicon and macOS 14+
        run: python3 build_installer.py
      - name: Verify package contents
        run: python3 Tests/verify_package.py dist/LogitechBatteryBridge-1.3.1-macOS14plus-arm64.pkg
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: LogitechBatteryBridge-macOS14plus-arm64
          path: dist/*.pkg
